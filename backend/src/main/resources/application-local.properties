# ═══════════════════════════════════════════════════
#   LOCAL PROFILE (default) — local MongoDB, no TLS
# ═══════════════════════════════════════════════════
# Start a MongoDB on localhost:27017 first, e.g.:
#   docker run -d -p 27017:27017 --name cloud4saya-mongo mongo:7
# or use the bundled docker-compose stack at the repo root.
# ═══════════════════════════════════════════════════

### MONGODB CONNECTION ###
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cloud4saya_db}
spring.data.mongodb.database=${MONGODB_DATABASE:cloud4saya_db}

### MAIL (local — points at a plain local sink; see scripts/mock-ai.mjs) ###
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.dev-mode=true

### COOKIE (local — no HTTPS) ###
app.cookie.secure=false
app.cookie.domain=localhost

### LOGGING ###
logging.level.root=INFO
logging.level.tn.esprit.pidev=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
