# ═══════════════════════════════════════════════════
#   DEV PROFILE — shared MongoDB Atlas
# ═══════════════════════════════════════════════════
# Requires the MONGODB_URI environment variable (see .env.example).
# Activating `dev` also activates the `atlas` group (see application.properties),
# which enables the relaxed-TLS Mongo client in MongoConfig.
# ═══════════════════════════════════════════════════

### MONGODB CONNECTION ###
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:cloud4saya_db}

### MAIL (dev — log to console unless SMTP env vars are set) ###
app.mail.dev-mode=${MAIL_DEV_MODE:true}

### COOKIE (dev — no HTTPS required) ###
app.cookie.secure=false
app.cookie.domain=localhost

### LOGGING ###
logging.level.root=INFO
logging.level.tn.esprit.pidev=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
