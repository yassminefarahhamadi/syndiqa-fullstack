# ═══════════════════════════════════════════════════
#   PRODUCTION PROFILE
# ═══════════════════════════════════════════════════
# All sensitive values MUST come from the environment. No fallbacks.
# Required: MONGODB_URI, JWT_SECRET, APP_INTERNAL_SECRET
# Recommended: MAIL_USERNAME, MAIL_PASSWORD, GEMINI_API_KEY, APP_BASE_URL,
#              COOKIE_DOMAIN, COOKIE_SECURE=true
# ═══════════════════════════════════════════════════

### MONGODB CONNECTION ###
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:cloud4saya_db}

### MAIL ###
app.mail.dev-mode=false

### COOKIE ###
app.cookie.secure=${COOKIE_SECURE:true}

### LOGGING ###
logging.level.root=WARN
logging.level.tn.esprit.pidev=INFO
